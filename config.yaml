raw:
  lab: '/home/adnane/Desktop/SOH_mlops/data/raw/data 1'
  real_ev: '/home/adnane/Desktop/SOH_mlops/data/raw/data 4'

processed:
  lab: '/home/adnane/Desktop/SOH_mlops/data/processed/lab'
  real_ev: '/home/adnane/Desktop/SOH_mlops/data/processed/data4'

processing:
  lab:
    nominal_capacity: 1.1
    outlier_threshold: 0.02
  data4:
    top_n: 30
    max_imf: 6


sequence:
  history_length: 100
  prediction_length: 10

features:
  lab:
    - t40_50
    - t50_60
    - t60_70
    - t70_80
    - t80_90
    - t90_100
    - SOH_hist
    - voltage_mean
    - voltage_std
    - current_mean
    - current_std
    - max_temp_mean
    - min_temp_std
    - voltage_slope
    - max_cell_voltage_at_80
  real_ev:
    - t40_50
    - t50_60
    - t60_70
    - t70_80
    - t80_90
    - t90_100
    - SOH_hist
    - voltage_mean
    - voltage_std
    - current_mean
    - current_std
    - max_temp_mean
    - min_temp_std
    - voltage_slope
    - max_cell_voltage_at_80
    - max_voltage_mean
    - max_voltage_std
    - min_voltage_mean
    - min_voltage_std
    - min_temp_mean
    - voltage_diff_mean
    - voltage_diff_std
    - temp_diff_std
    - mask_t40_50
    - mask_t50_60
    - mask_t60_70
    - mask_t70_80
    - mask_t80_90
    - mask_t90_100
    - mask_v80

model:
  name: multimodal_soh
  hidden_size: 128
  num_layers: 2
  image_size: 256
  freeze_visual_during_finetuning: true

training:
  stages:
    - lab
    - data4
  seed: 42
  device: auto
  num_workers: 2
  gradient_clip_norm: 1.0
  progress_bar: true
  optimizer: adamw
  loss: image_mse
  scheduler: reduce_on_plateau
  splits:
    lab:
      lifetime_quantiles: 5
      remainder_fraction: 0.24
      validation_fraction_of_remainder: 0.3333333333333333
      random_state: 42
    data4:
      train: [2, 4, 11, 14, 23, 34, 36, 50, 56, 57, 91, 131, 139, 141, 150, 155, 157, 165]
      val: [3, 51, 108, 119, 129, 140]
      test: [16, 67, 69, 152, 175, 176]
  lab:
    run_name: lab-pretraining
    epochs: 1
    batch_size: 32
    learning_rate: 0.0003
    weight_decay: 0.00001
    lstm_dropout: 0.30
    feature_dropout: 0.20
    early_stopping_patience: 15
    scheduler_factor: 0.50
    scheduler_patience: 2
    minimum_learning_rate: 0.000001
  data4:
    run_name: data4-finetuning
    epochs: 30
    batch_size: 16
    learning_rate: 0.0001
    weight_decay: 0.0001
    lstm_dropout: 0.20
    feature_dropout: 0.20
    early_stopping_patience: 6
    scheduler_factor: 0.50
    scheduler_patience: 1
    minimum_learning_rate: 0.0000001

artifacts:
  root: data/artifacts
  lab_directory: lab_pretraining
  data4_directory: data4_finetuning

mlflow:
  enabled: true
  tracking_uri_environment_variable: MLFLOW_URI
  experiment_name: soh-training
  log_pytorch_model: true
